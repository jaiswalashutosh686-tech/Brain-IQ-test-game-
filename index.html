<meta charset="utf-8">

<title>Neon Brain Arcade – Test Your IQ &amp; Develop Your Brain</title>

<style>
:root{--bg:#060814;--card:#ffffff0d;--line:#ffffff24;--tx:#f1f4ff;--mut:#9aa4cc;--c1:#22d3ee;--c2:#a855f7;--c3:#ec4899;--b1:#2563eb;--b2:#c026d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body::before{background:var(--b1);top:-120px;left:-120px}
body::after{background:var(--b2);bottom:-140px;right:-120px;animation-delay:-7s}
@keyframes fl{to{transform:translate(60px,80px) scale(1.2)}}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 48px}
h1{margin:0;font-size:30px;letter-spacing:.3px;line-height:1.1}
h1 span{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.tag{color:var(--mut);margin:6px 0 0;font-size:14px}
.lvl{margin:16px 0 22px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.bar{height:9px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c3));transition:width .5s;box-shadow:0 0 12px var(--c3)}
.lvl small{color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;overflow:hidden;text-align:left;padding:16px 14px;border-radius:24px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:158px;transition:transform .15s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 0,var(--g),transparent 65%);opacity:.3}
.card>*{position:relative}
.card:active{transform:scale(.96)}
.card:hover{box-shadow:0 0 28px -4px var(--g)}
.card:last-child:nth-child(odd){grid-column:span 2;min-height:120px}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--g),#ffffff22);box-shadow:0 6px 18px -4px var(--g);margin-bottom:6px}
.card b{font-size:17px}
.card small{color:var(--mut);font-size:12px}
.card em{margin-top:auto;padding-top:8px;font-style:normal;font-size:13px;color:#fff;font-weight:700}
.top{display:flex;align-items:center;gap:12px}
.top h2{flex:1;margin:0;font-size:20px}
#back{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.sc{text-align:right}.sc small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px}.sc b{font-size:26px;color:var(--c1);text-shadow:0 0 14px var(--c1)}
#hint{color:var(--mut);margin:12px 2px 16px;font-size:14px;line-height:1.4}
.info{display:flex;justify-content:space-between;color:var(--mut);font-weight:600;margin:4px 4px 10px}
.tile,.cell{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:#ffffff14;color:#fff;font-size:30px;cursor:pointer;padding:0;transition:transform .15s,background .2s,box-shadow .2s}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile.up{background:linear-gradient(135deg,#3b5bdb,#9333ea);transform:scale(1.05)}
.tile.ok{background:#0e6b55;box-shadow:0 0 16px #34d39999}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sg .tile{font-size:20px;font-weight:700}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad{aspect-ratio:1;border-radius:28px;border:2px solid var(--c);background:#ffffff0d;opacity:.5;transition:.12s;cursor:pointer}
.pad.on{background:var(--c);opacity:1;box-shadow:0 0 44px var(--c);transform:scale(.97)}
.q{font-size:44px;font-weight:800;text-align:center;margin:16px 0 22px;min-height:56px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:18px;border-radius:18px;border:1px solid var(--line);background:#ffffff14;color:#fff;font-size:21px;font-weight:700;cursor:pointer}
.opt.good{background:#0e8a6a;box-shadow:0 0 16px #34d399aa}.opt.bad{background:#9f1d40}
.wide{width:100%;margin-top:18px;padding:22px;font-size:24px}
.tb{height:9px;background:#ffffff1a;border-radius:9px;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c1),var(--c3));transition:width 1s linear}
.eg{display:grid;gap:8px}
.rz{height:300px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;cursor:pointer;transition:background .15s}
.rz.wait{background:#7f1d1d}.rz.go{background:#16a34a;box-shadow:0 0 50px #22c55e}.rz.res{background:#1d4ed8}
.lt{font-size:110px;line-height:1.1;font-weight:800;text-align:center;min-height:130px;color:var(--c1);text-shadow:0 0 30px var(--c1)}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;border-radius:24px;background:#ffffff0d;border:1px solid var(--line);margin-bottom:16px}
.dots span{aspect-ratio:1;display:grid;place-items:center}
.dots i{width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--c2));box-shadow:0 0 12px var(--c2)}
.dots.hide{min-height:300px;place-items:center;font-size:60px;display:flex;justify-content:center;align-items:center}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sl .tile{font-size:38px;font-weight:800;background:linear-gradient(135deg,#0ea5e9,#7c3aed)}
.sl .tile.blank{background:transparent;border:2px dashed var(--line)}
.lo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell.lit{background:linear-gradient(135deg,#fde047,#fb923c);box-shadow:0 0 20px #fbbf24aa}
#over{position:fixed;inset:0;background:#050714d9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.box{width:100%;max-width:340px;text-align:center;padding:28px 22px;border-radius:30px;background:#14183a;border:1px solid var(--line);box-shadow:0 0 60px #a855f766}
.box .em{font-size:56px}.box h2{margin:6px 0}
.big{font-size:60px;font-weight:800;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.box p{color:var(--mut)}
.btn{width:100%;margin-top:10px;padding:15px;border:0;border-radius:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c3))}
.btn.ghost{background:#ffffff14;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{padding:12px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.st b{display:block;font-size:21px}.st small{color:var(--mut);font-size:11px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.hb{padding:16px 14px;border-radius:22px;border:1px solid var(--line);text-align:left;color:#fff;cursor:pointer;min-height:120px;font-size:26px}
.hb.iq{background:linear-gradient(135deg,#6d28d9,#db2777)}.hb.dl{background:linear-gradient(135deg,#0891b2,#2563eb)}
.hb b{display:block;font-size:17px;margin:4px 0}.hb small{opacity:.9;font-size:12px}
.panel{padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin:0 0 14px}
.panel h3{margin:0 0 10px;font-size:16px}
.sk{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;margin:9px 0;font-size:13px;color:var(--mut)}
.sec{margin:24px 2px 12px;font-size:19px;font-weight:800}
.bd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.b1{text-align:center;padding:10px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:26px}
.b1 small{display:block;font-size:10px;color:var(--mut);margin-top:3px;line-height:1.2}
.b1.lock{opacity:.4;filter:grayscale(1)}
.th{display:flex;gap:8px;flex-wrap:wrap}
.th button{padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:700;cursor:pointer}
.th button.on{background:linear-gradient(135deg,var(--c1),var(--c3));border:0}
.th button:disabled{opacity:.4}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.np .opt{padding:16px}
.lt.dg{font-size:46px;letter-spacing:3px;min-height:80px;word-break:break-all}
.cell.ok{background:#0e8a6a}.cell.bad{background:#9f1d40}
.iqq{font-size:23px;font-weight:800;text-align:center;margin:10px 0 20px;line-height:1.4;min-height:90px;white-space:pre-line}
#ob{color:#fde68a;font-size:14px;line-height:1.6}
.wk{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;text-align:left;cursor:pointer;margin-bottom:14px;font-size:32px}
.wk b{display:block;font-size:17px}.wk small{font-size:12px;opacity:.92}
.bud{display:flex;align-items:center;gap:14px}
.orb{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 30% 30%,#fff8,var(--c2) 55%,var(--c3));box-shadow:0 0 34px var(--c2);animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07);box-shadow:0 0 50px var(--c3)}}
.bud small{color:var(--mut);display:block;margin-top:4px;line-height:1.4}
.rad{display:block;margin:8px auto 0;width:100%;max-width:300px;height:auto}
.shr{margin-top:12px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:700;cursor:pointer}
.tw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.peg{height:260px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(#ffffff30,#ffffff30) center/4px 100% no-repeat,#ffffff0a;display:flex;flex-direction:column-reverse;align-items:center;padding:8px 4px;gap:4px;cursor:pointer}
.peg.sel{box-shadow:0 0 20px var(--c1);border-color:var(--c1)}
.peg i{height:30px;border-radius:10px;display:block}
.eg.mir .cell:nth-child(4n+2){margin-right:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Neon <span>Brain</span> Arcade</h1>
    <p class="tag">Test Your IQ &amp; Develop Your Brain</p>
    <div class="lvl"><b id="lv"></b><div class="bar"><i id="xpb"></i></div><small id="xpt"></small></div>
  </header>
  <main id="home"><div class="grid" id="cards"></div></main>
  <section id="play" hidden>
    <div class="top"><button id="back">←</button><h2 id="gt"></h2><div class="sc"><small>SCORE</small><b id="s">0</b></div></div>
    <p id="hint"></p>
    <div id="stage"></div>
  </section>
</div>
<div id="over" hidden><div class="box"><div class="em" id="oe"></div><h2 id="ot"></h2><div class="big" id="os"></div><p id="op"></p><p id="ob"></p><button class="btn" id="again">Play again</button><button class="btn ghost" id="hm">Home</button></div></div>

<script>
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let mem={};
try{mem=JSON.parse(localStorage.getItem('nba')||'{}')||{}}catch(e){}
mem.best=mem.best||{};mem.xp=mem.xp||0;mem.days=mem.days||[];mem.played=mem.played||{};mem.badges=mem.badges||{};mem.iq=mem.iq||[];mem.plays=mem.plays||0;
const save=()=>{try{localStorage.setItem('nba',JSON.stringify(mem))}catch(e){}};
let timers=[],cur=null,wk=null;
const after=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id};
const every=(f,ms)=>{const id=setInterval(f,ms);timers.push(id);return id};
const clear=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]};
const setScore=n=>{$('#s').textContent=n};
const mk=(cls,txt)=>{const b=document.createElement('button');b.className=cls;if(txt!==undefined)b.textContent=txt;return b};
let AC;
const audio=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
const beep=(f,d=.3,type='sine',v=.3)=>{try{audio();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};
const NOTES=[261.6,329.6,392,523.3];
const secs=t0=>Math.floor((Date.now()-t0)/1000);
const TI='<div class="info"><span id="tl"></span><span>⏱ Beat the clock</span></div><div class="tb"><i id="tbar"></i></div>';
function clock(st,total,done){
  let t=total;const tl=st.querySelector('#tl'),bar=st.querySelector('#tbar');
  const draw=()=>{tl.textContent=Math.max(0,Math.ceil(t))+'s';bar.style.width=Math.max(0,t)/total*100+'%'};
  draw();every(()=>{t--;draw();if(t<=0)done()},1000);
  return d=>{t-=d;draw()};
}
function choose(ch,vals,isOk,cb){
  let lock=false;ch.innerHTML='';
  vals.forEach(v=>{const b=mk('opt',v);b.onclick=()=>{if(lock)return;lock=true;const g=isOk(v);b.classList.add(g?'good':'bad');cb(g)};ch.appendChild(b)});
}
const timeInfo=(st,left)=>'<div class="info"><span id="a">'+left+'</span><span id="tm">0s</span></div>';

const G=[
{id:'mem',name:'Memory Match',icon:'🧠',skill:'Memory',c:'#22d3ee',hint:'Flip cards and find all 8 pairs. Fewer moves = higher score.',
run(st,end){
  const E=['🚀','🪐','🔥','❄️','🐱','🐶','⚡','🔮'];
  const cards=shuf([...E,...E]);let open=[],found=0,moves=0,lock=false;const t0=Date.now();
  st.innerHTML=timeInfo(st,'Moves 0')+'<div class="mg"></div>';
  const g=st.querySelector('.mg');
  const bs=cards.map((v,i)=>{const b=mk('tile','?');b.onclick=()=>flip(i);g.appendChild(b);return b});
  every(()=>{st.querySelector('#tm').textContent=secs(t0)+'s'},500);
  function flip(i){
    if(lock||open.includes(i)||bs[i].classList.contains('ok'))return;
    bs[i].textContent=cards[i];bs[i].classList.add('up');open.push(i);
    if(open.length===2){
      moves++;st.querySelector('#a').textContent='Moves '+moves;
      const [a,b]=open;
      if(cards[a]===cards[b]){
        [a,b].forEach(k=>{bs[k].classList.remove('up');bs[k].classList.add('ok')});
        open=[];found++;setScore(found*100);
        if(found===8)after(()=>end(Math.max(100,1300-moves*20-secs(t0)*3)),500);
      }else{
        lock=true;
        after(()=>{[a,b].forEach(k=>{bs[k].textContent='?';bs[k].classList.remove('up')});open=[];lock=false},700);
      }
    }
  }
}},
{id:'pat',name:'Pattern Echo',icon:'🎵',skill:'Sequence memory',c:'#a855f7',hint:'Watch the lights, then repeat the pattern. It grows every round.',
run(st,end){
  const cols=['#22d3ee','#a855f7','#ec4899','#fbbf24'];let seq=[],pos=0,busy=true;
  st.innerHTML='<div class="info"><span id="ms"></span></div><div class="pg"></div>';
  const ms=st.querySelector('#ms');
  const pads=cols.map((c,i)=>{const b=mk('pad');b.style.setProperty('--c',c);b.onclick=()=>tap(i);st.querySelector('.pg').appendChild(b);return b});
  const lit=(i,d)=>{beep(NOTES[i],d/1000+.15);pads[i].classList.add('on');after(()=>pads[i].classList.remove('on'),d)};
  function round(){
    seq.push(rnd(4));pos=0;busy=true;ms.textContent='Watch…';setScore((seq.length-1)*10);
    seq.forEach((k,n)=>after(()=>lit(k,350),600+n*600));
    after(()=>{busy=false;ms.textContent='Your turn!'},600+seq.length*600);
  }
  function tap(i){
    if(busy)return;lit(i,200);
    if(i!==seq[pos]){busy=true;ms.textContent='Wrong!';beep(110,.6,'sawtooth',.25);after(()=>end((seq.length-1)*10),700);return}
    pos++;
    if(pos===seq.length){busy=true;setScore(seq.length*10);ms.textContent='Nice!';after(()=>{beep(659,.12);after(()=>beep(880,.2),120)},250);after(round,800)}
  }
  after(round,500);
}},
{id:'math',name:'Quick Math',icon:'➕',skill:'Mental speed',c:'#34d399',hint:'Solve as many as you can in 60 seconds. Wrong answer costs 3 seconds.',
run(st,end){
  let n=0,ans;
  st.innerHTML=TI+'<div class="q"></div><div class="ch"></div>';
  const pen=clock(st,60,()=>end(n*10));
  const q=st.querySelector('.q'),ch=st.querySelector('.ch');
  function next(){
    const L=Math.min(2+Math.floor(n/5),6),m=10*L;
    let a=1+rnd(m),b=1+rnd(m);const op=['+','-','×'][rnd(L>2?3:2)];
    if(op==='×'){a=2+rnd(Math.min(12,L*3));b=2+rnd(9)}
    if(op==='-'&&b>a)[a,b]=[b,a];
    ans=op==='+'?a+b:op==='-'?a-b:a*b;
    q.textContent=a+' '+op+' '+b+' = ?';
    const o=new Set([ans]);
    while(o.size<4){const k=1+rnd(10);o.add(Math.max(0,ans+(rnd(2)?k:-k)))}
    choose(ch,shuf([...o]),v=>v===ans,g=>{if(g){n++;setScore(n*10)}else pen(3);after(next,200)});
  }
  next();
}},
{id:'stroop',name:'Color Trap',icon:'🎨',skill:'Focus & control',c:'#ec4899',hint:'The word may lie! Tap the name of the COLOR the word is painted in.',
run(st,end){
  const C=[['RED','#ff4d6d'],['BLUE','#38bdf8'],['GREEN','#4ade80'],['YELLOW','#fde047']];
  let n=0,ci=0;
  st.innerHTML=TI+'<div class="q" id="w"></div><div class="info"><span>Which COLOR is this text?</span></div><div class="ch"></div>';
  const pen=clock(st,30,()=>end(n*10));
  const w=st.querySelector('#w'),ch=st.querySelector('.ch');
  function next(){
    const wi=rnd(4);ci=rnd(4);
    if(rnd(10)<8)while(ci===wi)ci=rnd(4);
    w.textContent=C[wi][0];w.style.color=C[ci][1];w.style.webkitTextFillColor=C[ci][1];w.style.textShadow='0 0 24px '+C[ci][1]+'99';
    choose(ch,C.map(c=>c[0]),v=>v===C[ci][0],g=>{if(g){n++;setScore(n*10)}else pen(3);after(next,200)});
  }
  next();
}},
{id:'order',name:'Number Hunt',icon:'🔢',skill:'Visual attention',c:'#fbbf24',hint:'Tap 1 to 25 in order, as fast as you can. Mistakes add 2 seconds.',
run(st,end){
  const N=25;let next=1,t0=Date.now();
  st.innerHTML='<div class="info"><span id="nx">Find 1</span><span id="tm">0.0s</span></div><div class="sg"></div>';
  const g=st.querySelector('.sg');
  shuf(Array.from({length:N},(_,i)=>i+1)).forEach(v=>{
    const b=mk('tile',v);
    b.onclick=()=>{
      if(b.classList.contains('ok'))return;
      if(v===next){
        b.classList.add('ok');next++;setScore(v*10);
        if(next>N)after(()=>end(Math.max(50,Math.round(1500-(Date.now()-t0)/1000*20))),300);
        else st.querySelector('#nx').textContent='Find '+next;
      }else{b.classList.add('shake');after(()=>b.classList.remove('shake'),300);t0-=2000}
    };
    g.appendChild(b);
  });
  every(()=>{st.querySelector('#tm').textContent=((Date.now()-t0)/1000).toFixed(1)+'s'},100);
}},

const Q=[
['2, 4, 8, 16, ?','32',['24','30','34']],['3, 6, 9, 12, ?','15',['14','16','18']],['1, 4, 9, 16, ?','25',['20','24','36']],
['2, 3, 5, 8, 12, ?','17',['15','16','18']],['1, 1, 2, 3, 5, 8, ?','13',['11','12','14']],['100, 90, 81, 73, ?','66',['64','65','68']],
['2, 6, 12, 20, 30, ?','42',['36','40','44']],
['Which one does not belong?\nApple · Banana · Carrot · Mango','Carrot',['Apple','Banana','Mango']],
['Which one does not belong?\nCircle · Square · Triangle · Cube','Cube',['Circle','Square','Triangle']],
['Which one does not belong?\nDog · Cat · Eagle · Horse','Eagle',['Dog','Cat','Horse']],
['Bird : Nest :: Bee : ?','Hive',['Honey','Flower','Wing']],['Hot : Cold :: Up : ?','Down',['Left','High','Top']],
['Eye : See :: Ear : ?','Hear',['Taste','Smell','Touch']],
['All Bloops are Razzies. All Razzies are Lazzies. So all Bloops are…','Lazzies',['Not Razzies','Neither','Unknown']],
['A is taller than B. B is taller than C. Who is the shortest?','C',['A','B','Cannot say']],
['What time is it 15 minutes after 3:50?','4:05',['4:00','4:15','4:10']]
];
const IQ={id:'iq',name:'IQ Test',icon:'🧠',hint:'10 questions: patterns, logic and words. A fun estimate, not a clinical test.',
run(st,end){
  const qs=shuf(Q).slice(0,10);let i=0,ok=0;
  st.innerHTML='<div class="info"><span id="pr"></span></div><div class="iqq"></div><div class="ch" style="grid-template-columns:1fr"></div>';
  const pr=st.querySelector('#pr'),qt=st.querySelector('.iqq'),ch=st.querySelector('.ch');
  function next(){
    if(i>=10){end(Math.round(70+6.5*ok));return}
    const [q,a,w]=qs[i];i++;pr.textContent='Question '+i+'/10';qt.textContent=q;
    choose(ch,shuf([a,...w]),v=>v===a,g=>{if(g){ok++;setScore(ok)}after(next,600)});
  }
  next();
}};
  const BUD=['🥚','🐣','🦉','🦅','🐉','🌌'],BN=['Egg','Chick','Owl','Falcon','Dragon','Cosmos'];
function radar(sk){
  const P=(v,i)=>{const a=-Math.PI/2+i*Math.PI/2;return [100+70*v/100*Math.cos(a),100+70*v/100*Math.sin(a)]};
  const f=p=>p.map(n=>n.toFixed(1)).join(',');
  const ring=[25,50,75,100].map(v=>'<polygon points="'+CATS.map((c,i)=>f(P(v,i))).join(' ')+'" style="fill:none;stroke:#ffffff26"/>').join('');
  const lab=CATS.map((c,i)=>{const p=P(122,i);return '<text x="'+p[0].toFixed(0)+'" y="'+p[1].toFixed(0)+'" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#9aa4cc">'+c+' '+sk[c]+'</text>'}).join('');
  return '<svg class="rad" viewBox="-30 0 260 200">'+ring+'<polygon points="'+CATS.map((c,i)=>f(P(sk[c],i))).join(' ')+'" style="fill:var(--c1);fill-opacity:.35;stroke:var(--c1);stroke-width:2"/>'+lab+'</svg>';
}
function buddy(sk,idx){
  const st=Math.min(5,Math.floor((lvl()-1)/2)),happy=todayN()>0;
  return '<div class="panel"><div class="bud"><div class="orb">'+(happy?BUD[st]:'😴')+'</div><div><h3 style="margin:0">Neuro Buddy · '+BN[st]+'</h3><small>'+(happy?'Happy! Brain Index '+idx+'. Every game helps it evolve.':'Your buddy is sleepy. Play a game to wake it up!')+'</small></div></div>'+radar(sk)+'</div>';
}
function iqPanel(){
  if(!mem.iq.length)return '';
  const a=mem.iq.slice(-10),W=300,H=70;
  const x=i=>a.length>1?8+i*(W-16)/(a.length-1):W/2,y=v=>H-6-(Math.max(70,Math.min(140,v))-70)/70*(H-12);
  const pts=a.map((q,i)=>x(i).toFixed(0)+','+y(q.v).toFixed(0)).join(' ');
  const dots=a.map((q,i)=>'<circle cx="'+x(i).toFixed(0)+'" cy="'+y(q.v).toFixed(0)+'" r="4" style="fill:var(--c3)"/>').join('');
  const d=a[a.length-1].v-a[0].v;
  return '<div class="panel"><h3>IQ Journey</h3><svg viewBox="0 0 300 70" style="width:100%;height:80px"><polyline points="'+pts+'" style="fill:none;stroke:var(--c1);stroke-width:3"/>'+dots+'</svg><small style="color:var(--mut)">Latest '+a[a.length-1].v+' · Best '+bestIQ()+(a.length>1?' · '+(d>=0?'+':'')+d+' since first test':'')+'</small><button class="shr" id="shr">📤 Share my IQ</button></div>';
}
const wkCard=()=>'<button class="wk" id="wkb">🏋️<span><b>Daily Brain Workout</b><small>5 random games · discover your Brain Age'+(mem.ages&&mem.ages.length?' · Last '+mem.ages[mem.ages.length-1].v:'')+'</small></span></button>';
function home(){
  clear();cur=null;wk=null;applyTheme();
  $('#play').hidden=true;$('#home').hidden=false;
  const sk=skills(),dg=dailyGame(),lv=lvl(),li=mem.iq.length?mem.iq[mem.iq.length-1].v:0;
  const idx=Math.round(CATS.reduce((a,c)=>a+sk[c],0)/4);
  $('#lv').textContent='Lv '+lv+' '+TITLES[Math.min(5,Math.floor((lv-1)/2))];
  $('#xpb').style.width=(mem.xp%200)/2+'%';$('#xpt').textContent=mem.xp+' XP';
  $('#home').innerHTML=
  '<div class="stats"><div class="st"><b>🔥 '+streak()+'</b><small>Day streak</small></div><div class="st"><b>🎯 '+Math.min(3,todayN())+'/3</b><small>Daily goal</small></div><div class="st"><b>🏅 '+Object.keys(mem.badges).length+'/'+BD.length+'</b><small>Badges</small></div></div>'
  +'<div class="hero"><button class="hb iq" id="iqb">🧠<b>IQ Test</b><small>'+(li?'Last '+li+' · Best '+bestIQ():'10 questions · find your level')+'</small></button><button class="hb dl" id="dlb">🎯<b>Daily Challenge</b><small>'+dg.name+' · '+(mem.dailyDone===today()?'Done ✅':'2× XP today')+'</small></button></div>'
  +wkCard()+buddy(sk,idx)+iqPanel()
  +'<div class="sec">Games</div><div class="grid" id="cards">'+G.map((g,i)=>'<button class="card" style="--g:'+g.c+'" data-i="'+i+'"><span class="ic">'+g.icon+'</span><b>'+g.name+'</b><small>'+g.skill+'</small><em>🏆 Best '+(mem.best[g.id]||0)+'</em></button>').join('')+'</div>'
  +'<div class="sec">Awards</div><div class="bd">'+BD.map(b=>'<div class="b1'+(mem.badges[b[0]]?'':' lock')+'">'+b[1]+'<small>'+(mem.badges[b[0]]?b[2]:b[3])+'</small></div>').join('')+'</div>'
  +'<div class="sec">Themes</div><div class="th">'+TH.map(t=>'<button data-t="'+t[0]+'" class="'+((mem.theme||'Neon')===t[0]&&lv>=t[1]?'on':'')+'"'+(lv<t[1]?' disabled':'')+'>'+(lv<t[1]?'🔒 Lv '+t[1]+' ':'')+t[0]+'</button>').join('')+'</div>';
  $('#wkb').onclick=()=>{wk={list:shuf(G).slice(0,5),i:0,sc:[]};start(wk.list[0])};
  const sb=$('#shr');if(sb)sb.onclick=()=>{const t='My IQ estimate on Neon Brain Arcade: '+li+'! Can you beat it? 🧠';if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);sb.textContent='Copied ✅'}catch(e){sb.textContent=t}}};
  $('#iqb').onclick=()=>start(IQ);$('#dlb').onclick=()=>start(dg);
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>start(G[b.dataset.i]));
  document.querySelectorAll('.th button').forEach(b=>b.onclick=()=>{mem.theme=b.dataset.t;save();home()});
}
function start(g){
  clear();cur=g;setScore(0);audio();
  $('#home').hidden=true;$('#play').hidden=false;
  $('#gt').textContent=g.icon+' '+g.name;$('#hint').textContent=g.hint;
  $('#stage').innerHTML='';
  g.run($('#stage'),finish);
}
function finish(f){
  if(!cur)return;
  const g=cur;cur=null;clear();setScore(f);
  const t=today(),old=lvl(),notes=[];
  const nb=f>(mem.best[g.id]||0);if(nb)mem.best[g.id]=f;
  mem.plays++;mem.played[g.id]=(mem.played[g.id]||0)+1;
  if(!mem.days.includes(t))mem.days.push(t);
  let xp=g.id==='iq'?50:Math.round(f/10);
  if(g.id==='iq')mem.iq.push({d:t,v:f});
  else if(dailyGame().id===g.id&&mem.dailyDone!==t){mem.dailyDone=t;xp*=2;notes.push('🎯 Daily Challenge done: 2× XP!')}
  if(!(mem.tc&&mem.tc.d===t))mem.tc={d:t,n:0};
  mem.tc.n++;
  if(mem.tc.n===3){xp+=50;notes.push('✅ Daily goal complete: +50 XP')}
  mem.xp+=xp;
  notes.push(...checkBadges());
  const nw=lvl();
  if(nw>old){notes.push('⬆️ Level '+nw+' reached!');const th=TH.find(x=>x[1]===nw);if(th)notes.push('🎨 Theme unlocked: '+th[0])}
  save();
  const iq=g.id==='iq';
  $('#oe').textContent=iq?'🧠':nb?'🏆':'⭐';
  $('#ot').textContent=iq?(f>=130?'Exceptional mind!':f>=115?'Above average!':f>=100?'Solid thinker':'Keep training!'):nb?'New best!':'Game over';
  $('#os').textContent=f;
  $('#op').textContent=iq?'Your IQ estimate · +50 XP':'+'+xp+' XP · Best '+(mem.best[g.id]||0);
  $('#ob').innerHTML=notes.join('<br>');
  $('#over').hidden=false;
  $('#again').onclick=()=>{$('#over').hidden=true;start(g)};
  $('#hm').onclick=()=>{$('#over').hidden=true;home()};
  $('#again').textContent='Play again';
  if(wk){
    wk.sc.push(Math.min(100,Math.round(f/(g.ref||100)*100)));wk.i++;
    if(wk.i<5){
      const nx=wk.list[wk.i];$('#again').textContent='Next game ▶ ('+(wk.i+1)+'/5)';
      $('#again').onclick=()=>{$('#over').hidden=true;start(nx)};
    }else{
      const avg=Math.round(wk.sc.reduce((a,b)=>a+b,0)/5),age=Math.max(18,Math.min(80,Math.round(60-avg*.45)));
      mem.ages=mem.ages||[];mem.ages.push({d:t,v:age});mem.xp+=100;mem.wkDone=t;
      const ex=checkBadges();save();
      $('#oe').textContent='🏋️';$('#ot').textContent='Workout complete!';$('#os').textContent='Age '+age;
      $('#op').textContent='Your Brain Age · score '+avg+'/100 · +100 XP';
      $('#ob').innerHTML=notes.concat(ex).join('<br>');
      wk=null;
    }
  }
}
$('#back').onclick=home;
home();
</script>
</body>
</html>
